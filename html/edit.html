<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Retold Content</title>
		<!-- Favicons (generated by `npm run brand`) — auto-switching for light/dark UA -->
		<link rel="icon" type="image/svg+xml" href="favicons/favicon.svg">
		<link rel="icon" type="image/svg+xml" href="favicons/favicon-light.svg" media="(prefers-color-scheme: light)">
		<link rel="icon" type="image/svg+xml" href="favicons/favicon-dark.svg"  media="(prefers-color-scheme: dark)">
		<link href="css/content-system.css" rel="stylesheet">
		<!-- KaTeX stylesheet for LaTeX equation rendering -->
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css">
		<!-- PICT Dynamic View CSS Container -->
		<style id="PICT-CSS"></style>
		<!-- CodeMirror bundle (sets window.CodeMirrorModules) -->
		<script src="./codemirror-bundle.js" type="text/javascript"></script>
		<!-- CodeJar + highlight.js bundle (sets window.CodeJarModules) -->
		<script src="./codejar-bundle.js" type="text/javascript"></script>
		<!-- Pict framework -->
		<script src="./js/pict.min.js" type="text/javascript"></script>
		<script type="text/javascript">
			Pict.safeOnDocumentReady(function () { Pict.safeLoadPictApplication(PictContentEditor, 2); });
		</script>
	</head>
	<body>
		<div id="ContentEditor-Application-Container"></div>
		<!-- Mermaid diagram rendering. pict-section-content's Pict-Content
		     view owns initialization — it reads --theme-color-* CSS vars
		     and calls mermaid.initialize() with theme: 'base' +
		     themeVariables, then re-runs the diagrams on every theme
		     change. Keep startOnLoad off so the view can drive timing. -->
		<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
		<!-- KaTeX for LaTeX equation rendering -->
		<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js"></script>
		<script src="./retold-content-system.min.js" type="text/javascript"></script>
	</body>
</html>
